# ============================================
# Erros e Avisos Globais
# ============================================
error:
    invalid_page: "<red>Página invalida. Por favor, use um número entre [1-<total_pages>]."
    is_not_player: "Esse comando só pode ser usado por um jogador."
    unknown_subcommand: "<red>Subcomando desconhecido: <command_name>."
    no_permission: "<red>Você não tem permissão de usar esse comando."
    no_player: "<red>Jogador não encontrado."
    no_clan: "<red>Clã não encontrado."
    no_member_invite: "<red>Convite para clã não encontrado."
    already_invited: "<red>Já existe um convite para <name>."
    arguments_missing: "<red>Falta argumentos para completar o comando, use <gold>/<command_name> help</gold> para mais informações"
    already_in_a_clan: "<red>O jogador <bold><player_name></bold> já está em um clã."
    not_in_clan: "<red>Você não está em nenhum clã."
    internal_error: "<dark_red>Erro interno. Contate a administração."
    missing_arguments: "<red>Faltam argumentos para este comando."
    not_implemented: "<yellow>Este comando ainda não foi implementado."
    player_not_found: "<red>Jogador não encontrado."
    generic: "<red>Ocorreu um erro inesperado."
    clan_not_found: "<red>Clã <bold><clan_name></bold> não encontrado."
    not-enough-points: "<red><bold>SALDO INSUFICIENTE!</bold></red> <gray>Você não possui pontos/recursos suficientes para realizar esta ação.</gray>"
    invalid_arguments: "<yellow><bold>SINTAXE INVÁLIDA!</bold></yellow> <gray>Os argumentos informados estão incorretos. Verifique o comando e tente novamente.</gray>"
    anticore-entity-not-found: "<red><bold>ERRO DE DADOS!</bold></red> <gray>A entidade vinculada a este Anti-Core não foi encontrada no banco de dados. O item pode estar corrompido.</gray>"

info:
    admin_action: "<dark_red>Ação admin"

help:
    header: "<gold>---[ Ajuda Factions (Página <page>/<total_pages>) ]---</gold>"
    footer: "<gold>---[ Digite <bold>/<command> help <pagina></bold> para ver mais ]---</gold>"
    command:
        format: "<gold><command></gold><gray>: <description></gray>"

command:
    format: "/<alias> <subcommand>"

gui:
    previous_page: "<yellow>« Página Anterior</yellow>"
    next_page: "<yellow>Próxima Página »</yellow>"
    back: "<red>Voltar</red>"
    close: "<red>Fechar</red>"
    anticore:
        title: "<red>Compras para guerra!"
        buy_item:
            name: "Anticore"
            lore: "Ataca um núcleo de um clã. Preço: <price>"
        glowstone:
            name: "Glowstone"
            lore: "Usado para explodir um Anticore. \n O dano causado ao player <bold>não é negado</bold>, somente o dano estrutural."

# ============================================
# Comandos e Sistema de Clãs
# ============================================
clan:
    is_not_leader: "<red>Você não é o líder do clã."
    
    create:
        description: "Comando para criar um clã, se nenhum valor for colocado no [tag] ele será vazio."
        error:
            already_exists: "<red>Clã <clan_name> já existe."
        response: "Clã <bold><clan_name></bold> criado com sucesso."
        dropped_item: "<yellow>Seu inventário estava cheio, o Nexus caiu no chão!"
    
    quit:
        response: "Você saiu do clã"
        leader_response: "Membro <player_name> saiu do seu clã."
        error:
            leader: "<red>Você é o lider do clã, para deletar o clã use <bold><gold>/clan delete"
    
    delete:
        description: "Comando para deletar um clã, somente pode ser executado pelo líder do clã."
        response: "<dark_gray>Clã desfeito com sucesso."
        member_response: "<red>Clã desfeito por <leader_name>."
    
    list:
        description: "Comando para listar clãs por páginas. Se nenhum número for colocado no [page] ele será 1"
        header: "<gold>---[ Clãs (Página <page>/<total_page>) ]---"
        footer: "<gold>---[ Digite <bold><command> para ver mais ]---"
        response: "Clã: <bold><clan_name></bold> [<tag>], líder: <bold><leader_name></bold>."
        item:
            name: "<gold><clan_name> <dark_gray>[<yellow><clan_tag></yellow>]</dark_gray></gold>"
            lore: "<gray>Líder: <white><leader_name></white><newline><gray>Honra: <yellow><points></yellow><newline><yellow>Clique para ver detalhes</yellow>"
    
    list_menu:
        title: "<dark_green><bold>Lista de Clãs</bold></dark_green>"
    
    invite:
        invitation_text: "Você foi convidado para o clã <bold><clan_name></bold> para aceitar use o comando <gold>/clan invite accept <clan_name></gold>"
        response: "Convite para jogador <bold><player_name></bold> enviado com sucesso."
        accept:
            clan_response: "Membro <bold><gold><player_name></gold></bold> se juntou ao clã"
            response: "Você se juntou ao clã <bold><clan_name></bold>"
        cancel:
            response: "<yellow>Você cancelou o convite para <bold><player_name></bold>."
        reject:
            response: "<yellow>Você recusou o convite do clã <bold><clan_name></bold>."
            clan_response: "<red>Jogador <bold><player_name></bold> recusou o convite."
        list:
            header: "<gold>---[ Convites Pendentes (<count>) ]---</gold>"
            entry: "<gray>- Clã: <white><clan_name></white></gray>"
            empty: "<yellow>Você não tem convites pendentes."
    
    ally:
        add:
            description: "Envia um convite de aliança para outro clã."
        remove:
            description: "Remove uma aliança com outro clã."
            response: "<yellow>Aliança com <bold><clan_name></bold> foi desfeita."
            target_response: "<red>O clã <bold><clan_name></bold> desfez a aliança."
        list:
            description: "Lista os clãs aliados."
            header: "<gold>---[ Clãs Aliados (<count>) ]---</gold>"
            entry: "<gray>- <white><clan_name></white></gray>"
            empty: "<yellow>Seu clã não possui aliados."
        accept:
            description: "Aceita um convite de aliança."
            response: "<green>Aliança com <bold><clan_name></bold> foi aceita!"
            sender_response: "<green>O clã <bold><clan_name></bold> aceitou sua aliança!"
        reject:
            description: "Recusa um convite de aliança."
            response: "<yellow>Você recusou a aliança do clã <bold><clan_name></bold>."
            sender_response: "<red>O clã <bold><clan_name></bold> recusou sua aliança."
        invite:
            response: "Convite de aliança para clã <clan_name> enviado."
            invitation_text: "O clã <bold><clan_name></bold> enviou um convite de aliança. Use <gold>/clan ally accept <clan_name></gold> para aceitar."
        error:
            is_ally: "<red>Os clãs já são aliados."
            is_enemy: "<red>Os clãs são inimigos, para se aliar, deve acabar a guerra."
            no_invite: "<red>Não há convite de aliança deste clã."
            same_clan: "<red>Você não pode se aliar ao próprio clã."
    
    member:
        list:
            header: "<gold>---[ Membros do Clã (<count> membros) ]---</gold>"
            entry: "<gray>- <white><player_name></white> <dark_gray>(<role>)</dark_gray></gray>"
        kick:
            response: "<yellow>Jogador <bold><player_name></bold> foi removido do clã."
            target_response: "<red>Você foi removido do clã por <leader_name>."
        promote:
            response: "<green>Você transferiu a liderança do clã para <bold><player_name></bold>."
            new_leader: "<gold>Você agora é o líder do clã <bold><clan_name></bold>!"
            error:
                self: "<red>Você não pode promover a si mesmo."
    
    admin:
        description: "Comandos de administração de clãs."
        delete:
            description: "Deleta um clã."
            response: "<green>Clã <bold><clan_name></bold> deletado com sucesso."
            target_response: "<red>Seu clã foi deletado pelo admin <admin_name>."
        setname:
            description: "Altera o nome de um clã."
            response: "<green>Nome do clã alterado de <bold><old_name></bold> para <bold><new_name></bold>."
        settag:
            description: "Altera a tag de um clã."
            response: "<green>Tag do clã <bold><clan_name></bold> alterada para <bold><new_tag></bold>."
            error:
                exists: "<red>A tag <bold><tag></bold> já está em uso."
        setleader:
            description: "Altera o líder de um clã."
            response: "<green>Líder do clã <bold><clan_name></bold> alterado para <bold><new_leader></bold>."
            target_response: "<gold>Você agora é o líder do clã <bold><clan_name></bold>! (Alterado pelo admin <admin_name>)"
            old_leader_response: "<yellow>Você não é mais o líder do clã <clan_name>. O novo líder é <new_leader>."
    
    claim:
        response: "Você comprou um núcleo de clã. Coloque ele no chão para reivindicar uma área de 3x3 Chunks para seu clã. <bold>Somente o chefe do clã pode fazer isso</bold>."
        anti_core:
            purchased: "Você comprou um anticore, com ele você faz <bold>guerra</bold>. Coloque ele proximo a um núcleo de outro clã para começar uma guerra. <red>Defenda ele ate o final."
        nexus:
            already_placed: "<red><bold>ERRO!</bold> O Nexus do seu clã já foi estabelecido em outra localização."
            success: "<gradient:green:dark_green><bold>NEXUS ESTABELECIDO!</bold></gradient> <gray>O coração do seu clã agora bate nestas coordenadas.</gray>"
            
    betray:
        response: "<red><bold>TRAIÇÃO!</bold></red> <gray>A aliança com</gray> <white><clan_name></white> <gray>foi quebrada e agora vocês são inimigos mortais!</gray>"
        require_command: "<yellow><bold>CUIDADO!</bold></yellow> <gray>Para trair um aliado, use o comando</gray> <white>/clan betray <clan></white> <gray>antes de colocar um Anti-Core.</gray>"
        error:
            same_clan: "<red>Você não pode trair a si mesmo.</red>"
            not_ally: "<red>Este clã não é seu aliado, não há uma aliança para ser quebrada.</red>"
            
    surrender:
        response: "<gray>Você se rendeu para</gray> <white><clan_name></white><gray>.</gray>"
        error:
            not_at_war: "<red>Você só pode se render se estiver em uma guerra ativa!</red>"
            same_clan: "<red>Rendição interna? Seus membros já te obedecem (ou deveriam).</red>"
            
    glowstone:
        purchased: "<yellow>Você adquiriu Pedras Luminosas. Use elas para explodir os Anti-Cores."

# ============================================
# Comandos de Membro (Raiz)
# ============================================
member:
    invite:
        description: "Convida um jogador para o clã."
    remove:
        description: "Remove um membro do clã."
    promote:
        description: "Promove um membro do clã."
    list:
        description: "Lista os membros do clã."

# ============================================
# Estruturas e Items
# ============================================
core:
    place:
        success: "Nucleo de clã colocado com sucesso."
    damage: "<yellow>NEXUS:</yellow> <white><core_health> HP <gray>(-<damage>)"

nexus:
    name: "Núcleo do clã (<tag>)"
    error: "<red><bold>ERRO!</bold> Não foi possível processar a criação do núcleo agora."
    place:
        success: "<gradient:green:dark_green><bold>NEXUS ESTABELECIDO!</bold></gradient> <gray>O coração do seu clã agora bate nestas coordenadas.</gray>"
        error: "<red><bold>TERRENO OBSTRUÍDO!</bold> A base do Nexus precisa de uma área de 3x3 de blocos substituíveis (Ferro/Diamante)."
        error_border: "<yellow><bold>BORDA DE CHUNK!</bold> Você não pode colocar o Core tão perto da borda. Ele deve estar inteiramente dentro de um único Chunk."
    protect.indestructible: "<red>Nucleo de clã, entre em <bold>guerra</bold> pra quebrar."
anticore:
    name: "Anti-Core"
    placed: "<yellow>Anti-Core colocado no núcleo do clã <defender_clan>"
    removed: "<gray>O Anti-Core foi removido e a drenagem cessou.</gray>"
    error:
        attacking-same-clan: "<yellow>Você esta atacando o seu próprio clã, coloque o anti core mais proximo de um núcleo de outro clã"
        no-influence-zone: "<red>Você esta tentando colocar o anticore em uma zona onde não tem núcleos ativos, coloque o anticore em um chunk inimigo"
    destroyed:
        glowstone: "<red>Um Anticore do clã <attacker_clan> foi destruido por <destroyer_player> usando glowstone."
    compass:
        name: "Rastreador de Anti Core"
        lore:
            - "<gray>Este item se autodestruirá em <white>60 segundos</white>."
            - "<gray>Aponta para o Anti-Core ativo mais próximo."
            - ""
            - "<red><bold>AVISO:</bold> <gray>Uso único e temporário.</gray>"
        activate: "<gradient:green:dark_green><bold>RASTREADOR ATIVADO: Ameaça Detectada!</bold></gradient>"
        message: "<yellow>Alvo: <white><dist>m <dark_gray>| <red>Expira em: <white><seconds_left>s"
        
# ============================================
# Sistema de Guerra e Pontos
# ============================================
kill:
    stolen:
        killer: "<yellow>Você roubou <bold><stolen_points></bold> do jogador <bold><victim></bold>"
        victim: "<red>Jogador <bold><player></bold> roubou <bold><stolen_points></bold> de você"
        
war:
    started:
        broadcast: "<dark_red><bold>GUERRA!</bold></dark_red> <white><attacker></white> está drenando a energia do núcleo de <white><defender></white>!"
        
        attacker:
            title: "<gradient:gold:yellow><bold>CERCO INICIADO</bold></gradient>"
            subtitle: "<gray>Mantenha os Anti-Cores ativos para drenar o Nexus inimigo!</gray>"
        
        defender:
            title: "<dark_red><bold>NÚCLEO SOB ATAQUE!</bold></dark_red>"
            subtitle: "<yellow>A integridade do Nexus está caindo! Destrua as âncoras inimigas!</yellow>"
    ended:
        broadcast: "<gold><bold>FIM DE GUERRA!</bold></gold> <white><surrendered></white> hasteou a bandeira branca diante de <white><winner></white>!"
        
        # O Atacante venceu porque o Defensor deu /surrender
        attacker_won:
            title: "<gradient:gold:yellow><bold>VITÓRIA ABSOLUTA</bold></gradient>"
            subtitle: "<gray>O inimigo se rendeu! O Nexus adversário foi subjugado.</gray>"
        
        # O Atacante se rendeu e o Defensor venceu a defesa
        defender_won:
            title: "<gradient:green:dark_green><bold>VITÓRIA DEFENSIVA</bold></gradient>"
            subtitle: "<gray>O invasor desistiu! Seu núcleo está seguro por enquanto.</gray>"
        
        # Título para quem deu /surrender sendo o Atacante
        attacker_surrendered:
            title: "<red><bold>RETIRADA ESTRATÉGICA</bold></red>"
            subtitle: "<gray>Você abandonou o cerco. Suas âncoras de drenagem sumiram.</gray>"
        
        # Título para quem deu /surrender sendo o Defensor
        defender_surrendered:
            title: "<dark_red><bold>NÚCLEO ENTREGUE</bold></dark_red>"
            subtitle: "<gray>Rendição confirmada. Suas defesas foram desativadas.</gray>"
teleport:
    starting: "<gray>Teleportando em <yellow><seconds>s</yellow>. Não se mova!</gray>"
    success: "<green>Teleporte concluído!</green>"
    error:
        in_combat: "<red>Você está em combate! Aguarde mais <seconds>s para teleportar.</red>"
        moved: "<red>Teleporte cancelado: você se moveu!</red>"
        no_nexus: "<red>Seu clã não possui um Nexus ativo para teleporte.</red>"
        insufficient_points: "<red>Você precisa de <cost> pontos para teleportar.</red>"